---
apiVersion: v1
kind: Namespace
metadata:
  name: inventory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory
  namespace: inventory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inventory-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "configmaps", "services", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["kagent.dev"]
    resources: ["*"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io", "source.toolkit.fluxcd.io", "kustomize.toolkit.fluxcd.io"]
    resources: ["*"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inventory-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: inventory-reader
subjects:
  - kind: ServiceAccount
    name: inventory
    namespace: inventory
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-script
  namespace: inventory
data:
  inventory.sh: |
    #!/bin/sh
    set -e
    echo "===== AI INVENTORY @ $(date -u +%FT%TZ) ====="
    echo
    echo "--- Cluster nodes ---"
    kubectl get nodes -o wide
    echo
    echo "--- kagent Agents ---"
    kubectl get agents.kagent.dev -A 2>/dev/null || echo "(no agents CRD)"
    echo
    echo "--- kagent ModelConfigs ---"
    kubectl get modelconfigs.kagent.dev -A 2>/dev/null || echo "(no modelconfigs CRD)"
    echo
    echo "--- kagent ToolServers / MCPServers ---"
    kubectl get toolservers.kagent.dev,remotemcpservers.kagent.dev -A 2>/dev/null || echo "(no toolservers CRD)"
    echo
    echo "--- Gateways + HTTPRoutes ---"
    kubectl get gateway,httproute -A 2>/dev/null
    echo
    echo "--- Flux HelmReleases ---"
    kubectl get helmrelease -A 2>/dev/null
    echo
    echo "--- OCI Repositories ---"
    kubectl get ocirepository -A 2>/dev/null
    echo
    echo "===== END ====="
---
apiVersion: batch/v1
kind: Job
metadata:
  name: inventory
  namespace: inventory
spec:
  template:
    spec:
      serviceAccountName: inventory
      restartPolicy: Never
      containers:
        - name: kubectl
          image: alpine/k8s:1.31.1
          command: ["/bin/sh", "/scripts/inventory.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: inventory-script
            defaultMode: 0755
  backoffLimit: 1
