---
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ollama-helm
  namespace: flux-system
spec:
  interval: 1h
  url: https://otwld.github.io/ollama-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
  namespace: ollama
spec:
  interval: 1h
  releaseName: ollama
  chart:
    spec:
      chart: ollama
      version: "1.57.0"
      sourceRef:
        kind: HelmRepository
        name: ollama-helm
        namespace: flux-system
  install:
    createNamespace: true
  values:
    ollama:
      gpu:
        enabled: false
      models:
        pull:
          - qwen3.6:27b
    persistentVolume:
      enabled: true
      size: 30Gi
    service:
      type: ClusterIP
      port: 11434
    resources:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        memory: 24Gi
    livenessProbe:
      initialDelaySeconds: 300
      timeoutSeconds: 10
      periodSeconds: 30
    readinessProbe:
      initialDelaySeconds: 60
      timeoutSeconds: 10
      periodSeconds: 30
