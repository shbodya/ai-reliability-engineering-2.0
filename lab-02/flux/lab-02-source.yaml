apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: lab-02
  namespace: flux-system
spec:
  interval: 1m
  url: oci://ghcr.io/shbodya/ai-reliability-engineering-2.0/lab-02
  ref:
    tag: "0.1.0"
  secretRef:
    name: ghcr-lab02
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lab-02
  namespace: flux-system
spec:
  interval: 2m
  sourceRef:
    kind: OCIRepository
    name: lab-02
  path: ./
  prune: true
  wait: true
  timeout: 5m
  retryInterval: 30s
