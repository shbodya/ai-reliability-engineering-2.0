apiVersion: v1
kind: Secret
metadata:
  name: kagent-openai-stub
  namespace: kagent
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-unused-agentgateway-ignores"
---
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: ollama-via-gw
  namespace: kagent
spec:
  provider: OpenAI
  model: llama3.2:1b
  apiKeySecret: kagent-openai-stub
  apiKeySecretKey: OPENAI_API_KEY
  openAI:
    baseUrl: http://agentgateway-external.agentgateway-system.svc.cluster.local/v1
