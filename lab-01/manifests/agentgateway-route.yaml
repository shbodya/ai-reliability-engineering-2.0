apiVersion: v1
kind: Namespace
metadata:
  name: ai
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: ollama
  namespace: ai
spec:
  ai:
    groups:
      - providers:
          - name: ollama
            host: ollama.ollama.svc.cluster.local
            port: 11434
            openai:
              model: llama3.2:1b
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-gw
  namespace: ai
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: llm
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama-route
  namespace: ai
spec:
  parentRefs:
    - name: ai-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: ollama
          port: 11434
